<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1200" height="800" fill="#fff"/>
<rect x="20" y="20" width="570" height="560" rx="14" fill="#f6fbf7" stroke="#2e7d4f" stroke-width="2"/>
<text x="44" y="56" font-size="21" font-weight="700" fill="#2e7d4f">OPEN — where it connects</text>
<text x="44" y="80" font-size="15" font-style="italic" fill="#2e7d4f">Anyone can read it, use it, build on it</text>
