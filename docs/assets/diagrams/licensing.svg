<text x="650" y="470" font-size="18" font-weight="700" fill="#334">Acervus, Rara Bridge, remote MCP</text>
<text x="650" y="494" font-size="14.5" fill="#334">Hosted by RARA.</text>
<rect x="646" y="530" width="498" height="26" rx="6" fill="#ffffff" stroke="#a33a3a" stroke-width="1"/>
