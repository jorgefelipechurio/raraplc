<text x="60" y="146" font-size="18" font-weight="700" fill="#334">Schematic, pinout, datasheet, 3D model</text>
<text x="60" y="170" font-size="14.5" fill="#334">Everything you need to wire, mount and repair it.</text>
<rect x="56" y="206" width="498" height="26" rx="6" fill="#ffffff" stroke="#2e7d4f" stroke-width="1"/>
<text x="305.0" y="224" font-size="14" font-weight="700" text-anchor="middle" fill="#2e7d4f">CC BY-SA 4.0</text>
