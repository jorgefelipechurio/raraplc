<rect x="44" y="418" width="522" height="148" rx="10" fill="#e3f3e8" stroke="#2e7d4f" stroke-width="2"/>
<text x="60" y="446" font-size="13" font-weight="700" fill="#2e7d4f">S2 · HOST CODE</text>
<text x="60" y="470" font-size="18" font-weight="700" fill="#334">Arduino / Zephyr library, local MCP server, CLI</text>
<text x="60" y="494" font-size="14.5" fill="#334">The code that runs on your PLC and your laptop.</text>
<rect x="56" y="530" width="498" height="26" rx="6" fill="#ffffff" stroke="#2e7d4f" stroke-width="1"/>
