<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6B6555" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="900" fill="#F5F0E6"/>
<text x="40" y="58" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="400" fill="#C1622E" text-anchor="start" letter-spacing="6">LICENSING BY LAYER</text>
<text x="40" y="84" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6B6555" text-anchor="start" letter-spacing="2.5">OPEN WHERE IT CONNECTS · CLOSED WHERE IT IS COPIED</text>
<line x1="40" y1="120" x2="585" y2="120" stroke="#C1622E" stroke-width="1.5"/>
<text x="40" y="146" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#6B6555" text-anchor="start" letter-spacing="3">01 — OPEN</text>
<text x="585" y="146" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="400" fill="#C1622E" text-anchor="end" font-style="italic">anyone can read, use, build on it</text>
<line x1="615" y1="120" x2="1160" y2="120" stroke="#C1622E" stroke-width="1.5"/>
<text x="615" y="146" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#6B6555" text-anchor="start" letter-spacing="3">02 — CLOSED</text>
<text x="1160" y="146" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="400" fill="#C1622E" text-anchor="end" font-style="italic">keeps clones out, the service alive</text>
<rect x="40" y="168" width="545" height="150" rx="2" fill="#FBF8F1" stroke="#D8D2C2" stroke-width="1.5"/>
<rect x="40" y="168" width="4" height="150" fill="#1F5C4D"/>
<text x="62" y="198" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="700" fill="#1F5C4D" text-anchor="start" letter-spacing="2">H1 · HARDWARE DOCS</text>
<text x="62" y="226" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="400" fill="#2B2B28" text-anchor="start">Schematic, pinout, datasheet, 3D model</text>
<text x="62" y="250" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B6555" text-anchor="start">Everything you need to wire, mount and repair it.</text>
<line x1="62" y1="278" x2="563" y2="278" stroke="#D8D2C2" stroke-width="1"/>
<text x="62" y="302" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#1F5C4D" text-anchor="start" letter-spacing="1.5">CC BY-SA 4.0</text>
<rect x="40" y="334" width="545" height="150" rx="2" fill="#FBF8F1" stroke="#D8D2C2" stroke-width="1.5"/>
<rect x="40" y="334" width="4" height="150" fill="#1F5C4D"/>
<text x="62" y="364" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="700" fill="#1F5C4D" text-anchor="start" letter-spacing="2">S1 · INTERFACE SPECS</text>
<text x="62" y="392" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="400" fill="#2B2B28" text-anchor="start">I2C &amp; USB protocols, machine.json, MCP spec</text>
<text x="62" y="416" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B6555" text-anchor="start">Anyone can talk to Ex Libris, even in closed products.</text>
<line x1="62" y1="444" x2="563" y2="444" stroke="#D8D2C2" stroke-width="1"/>
<text x="62" y="468" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#1F5C4D" text-anchor="start" letter-spacing="1.5">CC BY 4.0 · APACHE-2.0</text>
<rect x="40" y="500" width="545" height="150" rx="2" fill="#FBF8F1" stroke="#D8D2C2" stroke-width="1.5"/>
<rect x="40" y="500" width="4" height="150" fill="#1F5C4D"/>
<text x="62" y="530" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="700" fill="#1F5C4D" text-anchor="start" letter-spacing="2">S2 · HOST CODE</text>
<text x="62" y="558" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="400" fill="#2B2B28" text-anchor="start">Arduino / Zephyr library, local MCP server, CLI</text>
<text x="62" y="582" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B6555" text-anchor="start">The code that runs on your PLC and your laptop.</text>
<line x1="62" y1="610" x2="563" y2="610" stroke="#D8D2C2" stroke-width="1"/>
<text x="62" y="634" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#1F5C4D" text-anchor="start" letter-spacing="1.5">MPL-2.0</text>
<rect x="615" y="168" width="545" height="150" rx="2" fill="#FBF8F1" stroke="#D8D2C2" stroke-width="1.5"/>
<rect x="615" y="168" width="4" height="150" fill="#C1622E"/>
<text x="637" y="198" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="700" fill="#C1622E" text-anchor="start" letter-spacing="2">H2 · HARDWARE DESIGN</text>
<text x="637" y="226" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="400" fill="#2B2B28" text-anchor="start">KiCad sources, Gerbers, pick &amp; place, costed BOM</text>
<text x="637" y="250" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B6555" text-anchor="start">Shared only with the manufacturer, under NDA.</text>
<line x1="637" y1="278" x2="1138" y2="278" stroke="#D8D2C2" stroke-width="1"/>
<text x="637" y="302" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#C1622E" text-anchor="start" letter-spacing="1.5">ALL RIGHTS RESERVED</text>
<rect x="615" y="334" width="545" height="150" rx="2" fill="#FBF8F1" stroke="#D8D2C2" stroke-width="1.5"/>
<rect x="615" y="334" width="4" height="150" fill="#C1622E"/>
<text x="637" y="364" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="700" fill="#C1622E" text-anchor="start" letter-spacing="2">S3 · MODULE FIRMWARE</text>
<text x="637" y="392" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="400" fill="#2B2B28" text-anchor="start">Bootloader, runtime, crypto</text>
<text x="637" y="416" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B6555" text-anchor="start">Shipped only as a signed binary.</text>
<line x1="637" y1="444" x2="1138" y2="444" stroke="#D8D2C2" stroke-width="1"/>
<text x="637" y="468" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#C1622E" text-anchor="start" letter-spacing="1.5">PROPRIETARY · EULA</text>
<rect x="615" y="500" width="545" height="150" rx="2" fill="#FBF8F1" stroke="#D8D2C2" stroke-width="1.5"/>
<rect x="615" y="500" width="4" height="150" fill="#C1622E"/>
<text x="637" y="530" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="700" fill="#C1622E" text-anchor="start" letter-spacing="2">S4 · SERVICES</text>
<text x="637" y="558" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="400" fill="#2B2B28" text-anchor="start">Acervus, Rara Bridge, remote MCP</text>
<text x="637" y="582" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B6555" text-anchor="start">Hosted by RARA.</text>
<line x1="637" y1="610" x2="1138" y2="610" stroke="#D8D2C2" stroke-width="1"/>
<text x="637" y="634" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#C1622E" text-anchor="start" letter-spacing="1.5">PROPRIETARY · TERMS OF USE</text>
<line x1="40" y1="690" x2="1160" y2="690" stroke="#C1622E" stroke-width="1.5"/>
<text x="40" y="716" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#6B6555" text-anchor="start" letter-spacing="3">03 — ACROSS ALL LAYERS</text>
<rect x="40" y="738" width="360.0" height="140" rx="2" fill="#FBF8F1" stroke="#D8D2C2" stroke-width="1.5"/>
<rect x="40" y="738" width="4" height="140" fill="#1F5C4D"/>
<text x="62" y="768" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="700" fill="#1F5C4D" text-anchor="start" letter-spacing="2">D · YOUR DATA</text>
<text x="62" y="796" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="400" fill="#2B2B28" text-anchor="start">Machine records &amp; knowledge</text>
<text x="62" y="820" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B6555" text-anchor="start">Yours. Open formats, always exportable.</text>
<line x1="62" y1="838" x2="378.0" y2="838" stroke="#D8D2C2" stroke-width="1"/>
<text x="62" y="862" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#1F5C4D" text-anchor="start" letter-spacing="1.5">OWNED BY YOU</text>
<rect x="420.0" y="738" width="360.0" height="140" rx="2" fill="#FBF8F1" stroke="#D8D2C2" stroke-width="1.5"/>
<rect x="420.0" y="738" width="4" height="140" fill="#C1622E"/>
<text x="442.0" y="768" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="700" fill="#C1622E" text-anchor="start" letter-spacing="2">S5 · THE SIGNATURE</text>
<text x="442.0" y="796" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="400" fill="#2B2B28" text-anchor="start">Genuine modules only</text>
<text x="442.0" y="820" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B6555" text-anchor="start">Support and warranty for genuine modules.</text>
<line x1="442.0" y1="838" x2="758.0" y2="838" stroke="#D8D2C2" stroke-width="1"/>
<text x="442.0" y="862" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#C1622E" text-anchor="start" letter-spacing="1.5">GENUINE ONLY</text>
<rect x="800.0" y="738" width="360.0" height="140" rx="2" fill="#FBF8F1" stroke="#D8D2C2" stroke-width="1.5"/>
<rect x="800.0" y="738" width="4" height="140" fill="#2B2B28"/>
<text x="822.0" y="768" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="700" fill="#2B2B28" text-anchor="start" letter-spacing="2">M · BRAND</text>
<text x="822.0" y="796" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="400" fill="#2B2B28" text-anchor="start">RARA · Ex Libris · Rara Cat</text>
<text x="822.0" y="820" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B6555" text-anchor="start">"Compatible with RARA Ex Libris" is fine.</text>
<line x1="822.0" y1="838" x2="1138.0" y2="838" stroke="#D8D2C2" stroke-width="1"/>
<text x="822.0" y="862" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#2B2B28" text-anchor="start" letter-spacing="1.5">RESERVED TRADEMARK</text>
