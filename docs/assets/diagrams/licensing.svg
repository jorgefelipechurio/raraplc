<text x="60" y="284" font-size="13" font-weight="700" fill="#2e7d4f">S1 · INTERFACE SPECS</text>
<text x="60" y="308" font-size="18" font-weight="700" fill="#334">I2C &amp; USB protocols, machine.json, MCP spec</text>
<text x="60" y="332" font-size="14.5" fill="#334">Anyone can talk to Ex Libris — even in closed products.</text>
<rect x="56" y="368" width="498" height="26" rx="6" fill="#ffffff" stroke="#2e7d4f" stroke-width="1"/>
