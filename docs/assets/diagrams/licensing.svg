<text x="650" y="308" font-size="18" font-weight="700" fill="#334">Bootloader, runtime, crypto</text>
<text x="650" y="332" font-size="14.5" fill="#334">Shipped only as a signed binary.</text>
<rect x="646" y="368" width="498" height="26" rx="6" fill="#ffffff" stroke="#a33a3a" stroke-width="1"/>
