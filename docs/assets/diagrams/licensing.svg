<rect x="20" y="600" width="373" height="180" rx="10" fill="#e6eefb" stroke="#2f5fa8" stroke-width="2"/>
<text x="36" y="628" font-size="13" font-weight="700" fill="#2f5fa8">D · YOUR DATA</text>
<text x="36" y="652" font-size="18" font-weight="700" fill="#334">Machine records &amp; your knowledge</text>
<text x="36" y="676" font-size="14.5" fill="#334">Yours. Open formats.</text>
<text x="36" y="696" font-size="14.5" fill="#334">Always exportable.</text>
<rect x="32" y="744" width="349" height="26" rx="6" fill="#ffffff" stroke="#2f5fa8" stroke-width="1"/>
<text x="206.5" y="762" font-size="14" font-weight="700" text-anchor="middle" fill="#2f5fa8">Owned by you</text>
<rect x="413" y="600" width="373" height="180" rx="10" fill="#fdf3d6" stroke="#a07800" stroke-width="2"/>
<text x="429" y="628" font-size="13" font-weight="700" fill="#a07800">S5 · THE SIGNATURE</text>
<text x="429" y="652" font-size="18" font-weight="700" fill="#334">Genuine modules only</text>
<text x="429" y="676" font-size="14.5" fill="#334">Support and warranty only for</text>
<text x="429" y="696" font-size="14.5" fill="#334">genuine modules &amp; signed firmware.</text>
<rect x="425" y="744" width="349" height="26" rx="6" fill="#ffffff" stroke="#a07800" stroke-width="1"/>
<text x="599.5" y="762" font-size="14" font-weight="700" text-anchor="middle" fill="#a07800">Genuine only</text>
<rect x="806" y="600" width="374" height="180" rx="10" fill="#f1f2f4" stroke="#555" stroke-width="2"/>
<text x="822" y="628" font-size="13" font-weight="700" fill="#555">M · BRAND</text>
<text x="822" y="652" font-size="18" font-weight="700" fill="#334">RARA · Ex Libris · Rara Cat</text>
<text x="822" y="676" font-size="14.5" fill="#334">Say "compatible with RARA Ex Libris".</text>
<text x="822" y="696" font-size="14.5" fill="#334">Anything else, ask first.</text>
<rect x="818" y="744" width="350" height="26" rx="6" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="993.0" y="762" font-size="14" font-weight="700" text-anchor="middle" fill="#555">Reserved trademark</text>
