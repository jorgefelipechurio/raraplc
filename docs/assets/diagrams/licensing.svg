<text x="634" y="56" font-size="21" font-weight="700" fill="#a33a3a">CLOSED — where it's copied</text>
<text x="634" y="80" font-size="15" font-style="italic" fill="#a33a3a">What keeps clones out and the service alive</text>
<rect x="634" y="94" width="522" height="148" rx="10" fill="#f8e6e6" stroke="#a33a3a" stroke-width="2"/>
