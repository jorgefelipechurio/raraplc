<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" role="img" aria-label="RARA PLC system architecture"><title>RARA PLC — system architecture</title><style>
:root{--bg:#fbfaf7;--ink:#1d232a;--ink2:#56606b;--line:#c9cfd5;--blk:#ffffff;--main:#f1f4f6;--mb:#f6f1e8;--mbline:#c58a2c;
--mcu:#14594f;--mcut:#ffffff;--mcus:#cfe7e2;--ext:#ffffff;--ai:#e6f3f4;--ailine:#0e7a86;--wire:#46515c;--net:#0e7a86;--hdr:#1d232a;--hdrt:#f3f1ec}
@media (prefers-color-scheme:dark){:root{--bg:#0f1418;--ink:#e6eaee;--ink2:#9aa6b1;--line:#2d3742;--blk:#161d23;--main:#121a20;--mb:#1b1712;--mbline:#e2a23a;
--mcu:#1f7a6d;--mcut:#ffffff;--mcus:#cde9e3;--ext:#161d23;--ai:#0f2a2e;--ailine:#43c9d4;--wire:#9aa6b1;--net:#43c9d4;--hdr:#e6eaee;--hdrt:#0f1418}}
.bg{fill:var(--bg)}
text{font-family:'IBM Plex Sans',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.h1{font-size:24px;font-weight:700}.h2{font-size:13.5px;fill:var(--ink2)}
.col{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.12em;fill:var(--ink2)}
.t{font-size:14px;font-weight:600}.s{font-size:12px;fill:var(--ink2)}
.gl{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;font-weight:600}
.g-main{fill:var(--main);stroke:var(--line);stroke-width:1.5}
.g-mb{fill:var(--mb);stroke:var(--mbline);stroke-width:1.5;stroke-dasharray:6 4}.g-mb-l{fill:var(--mbline)}
.blk,.ext,.mb{fill:var(--blk);stroke:var(--line);stroke-width:1.2}.mb{stroke:var(--mbline)}
.mcu{fill:var(--mcu);stroke:none}.mcu-t{fill:var(--mcut);font-size:15px}.mcu-s{fill:var(--mcus)}
.ai{fill:var(--ai);stroke:var(--ailine);stroke-width:1.4}
.hdr{fill:var(--hdr)}.hdr-t{fill:var(--hdrt);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px}
.w{stroke:var(--wire);stroke-width:1.6;fill:none}.net{stroke:var(--net);stroke-width:1.8;fill:none;stroke-dasharray:6 5}
.wl{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;fill:var(--ink2)}.net-lab{fill:var(--net)}
.ah-w{fill:var(--wire)}.ah-net{fill:var(--net)}.leg{font-size:12px}
</style><defs><marker id="a-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-w" d="M0 0L10 5L0 10z"/></marker><marker id="a-net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-net" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1600" height="840"/><text class="h1" x="40" y="46">RARA PLC — system architecture</text><text class="h2" x="40" y="70">Main board (stage 1). Legacy plant on the left, robotics and AI on the right. The PLC itself never connects to the internet.</text><text class="col" x="40" y="112">PLANT / LEGACY SIDE</text><text class="col" x="1080" y="112">ROBOTICS + AI SIDE</text><rect class="g-main" x="440" y="96" width="560" height="454" rx="14"/><text class="gl g-main-l" x="456" y="120">RARA PLC · main board (STM32H743ZIT6, 4-layer)</text><rect class="blk" x="460" y="130" width="160" height="90" rx="8"/><text class="t blk-t" x="472" y="156">24 V power chain</text><text class="s blk-s" x="472" y="176">fuse · P-FET ideal diode</text><text class="s blk-s" x="472" y="193">TVS · CM choke</text><text class="s blk-s" x="472" y="210">bucks 5 V / 3.3 V · LDO</text><rect class="mcu" x="640" y="130" width="200" height="170" rx="8"/><text class="t mcu-t" x="652" y="156">STM32H743ZIT6</text><text class="s mcu-s" x="652" y="176">Cortex-M7 · 480 MHz · FPU</text><text class="s mcu-s" x="652" y="193">FreeRTOS runtime</text><text class="s mcu-s" x="652" y="210">scan cycle</text><text class="s mcu-s" x="652" y="227">+ execution auditor (C)</text><text class="s mcu-s" x="652" y="244">OTA A/B banks · signed</text><text class="s mcu-s" x="652" y="261">DFU rescue in ROM</text><rect class="blk" x="860" y="130" width="120" height="90" rx="8"/><text class="t blk-t" x="872" y="156">Storage</text><text class="s blk-s" x="872" y="176">QSPI NOR 16 MB</text><text class="s blk-s" x="872" y="193">LittleFS</text><text class="s blk-s" x="872" y="210">FRAM · RTC</text><rect class="blk" x="460" y="230" width="160" height="70" rx="8"/><text class="t blk-t" x="472" y="256">Local HMI</text><text class="s blk-s" x="472" y="276">3.5&quot; touch · SPI</text><text class="s blk-s" x="472" y="293">LVGL faceplates</text><rect class="blk" x="860" y="230" width="120" height="70" rx="8"/><text class="t blk-t" x="872" y="256">Diagnostics</text><text class="s blk-s" x="872" y="276">fan · board NTC</text><text class="s blk-s" x="872" y="293">HW fast-stop</text><rect class="blk" x="460" y="320" width="120" height="80" rx="8"/><text class="t blk-t" x="472" y="346">16 DI</text><text class="s blk-s" x="472" y="366">opto · 4–30 V</text><text class="s blk-s" x="472" y="383">encoder-capable</text><rect class="blk" x="590" y="320" width="120" height="80" rx="8"/><text class="t blk-t" x="602" y="346">16 DO</text><text class="s blk-s" x="602" y="366">low-side 2 A</text><text class="s blk-s" x="602" y="383">STEP/DIR capable</text><rect class="blk" x="720" y="320" width="120" height="80" rx="8"/><text class="t blk-t" x="732" y="346">8 AI</text><text class="s blk-s" x="732" y="366">4–20 mA / 0–10 V</text><text class="s blk-s" x="732" y="383">ADC3, own ground</text><rect class="blk" x="850" y="320" width="130" height="80" rx="8"/><text class="t blk-t" x="862" y="346">Temp &amp; weight</text><text class="s blk-s" x="862" y="366">2× MAX31856</text><text class="s blk-s" x="862" y="383">HX711 (DNP)</text><rect class="blk" x="460" y="420" width="150" height="80" rx="8"/><text class="t blk-t" x="472" y="446">Ethernet</text><text class="s blk-s" x="472" y="466">100BASE-T · RMII</text><text class="s blk-s" x="472" y="483">Modbus TCP · OPC-UA</text><rect class="blk" x="620" y="420" width="110" height="80" rx="8"/><text class="t blk-t" x="632" y="446">2× RS-485</text><text class="s blk-s" x="632" y="466">Modbus RTU</text><text class="s blk-s" x="632" y="483">2 ports</text><rect class="blk" x="740" y="420" width="100" height="80" rx="8"/><text class="t blk-t" x="752" y="446">CAN FD</text><text class="s blk-s" x="752" y="466">TCAN332</text><text class="s blk-s" x="752" y="483">CANopen-ready</text><rect class="blk" x="850" y="420" width="130" height="80" rx="8"/><text class="t blk-t" x="862" y="446">USB-C</text><text class="s blk-s" x="862" y="466">Cisco-style CLI</text><text class="s blk-s" x="862" y="483">CDC-ACM · DFU</text><rect class="hdr" x="460" y="510" width="520" height="28" rx="6"/><text class="s hdr-t" x="720" y="529" text-anchor="middle">40-pin HAT header · Raspberry Pi pinout · add-ons and the stage-2 motion HAT</text><rect class="g-mb" x="440" y="600" width="560" height="96" rx="14"/><text class="gl g-mb-l" x="456" y="626">STAGE 2 · RARA.MB motion HAT (stacks on the header)</text><text class="s" x="456" y="652">6 closed-loop stepper axes · joint gauges for cobots</text><text class="s" x="456" y="672">IO-Link master for end effectors</text><path class="w" d="M 720 538 L 720 600" marker-end="url(#a-w)"/><rect class="ext" x="40" y="130" width="320" height="100" rx="8"/><text class="t ext-t" x="52" y="156">Field devices</text><text class="s ext-s" x="52" y="176">sensors · valves · contactors · heaters</text><text class="s ext-s" x="52" y="193">24 V DI/DO · 4–20 mA · 0–10 V</text><text class="s ext-s" x="52" y="210">thermocouples · load cells</text><rect class="ext" x="40" y="290" width="320" height="110" rx="8"/><text class="t ext-t" x="52" y="316">Legacy plant</text><text class="s ext-s" x="52" y="336">SCADA · HMI panels · old PLCs</text><text class="s ext-s" x="52" y="353">VFDs · meters · remote I/O</text><text class="s ext-s" x="52" y="370">Modbus TCP/RTU · OPC-UA · CAN</text><path class="w" d="M 360 180 L 420 180 L 420 360 L 460 360" marker-end="url(#a-w)"/><text class="wl w-lab" x="368" y="172" text-anchor="start">field wiring</text><path class="w" d="M 360 345 L 400 345 L 400 460 L 460 460" marker-end="url(#a-w)"/><text class="wl w-lab" x="368" y="337" text-anchor="start">fieldbus</text><rect class="ext" x="1080" y="130" width="480" height="100" rx="8"/><text class="t ext-t" x="1092" y="156">Linux host (Raspberry Pi / PC)</text><text class="s ext-s" x="1092" y="176">micro-ROS agent → ROS 2 graph</text><text class="s ext-s" x="1092" y="193">MoveIt · Nav2 · perception run here, not on the PLC</text><text class="s ext-s" x="1092" y="210">the PLC is the real-time companion node</text><rect class="ext" x="1080" y="290" width="480" height="110" rx="8"/><text class="t ext-t" x="1092" y="316">Technician&#x27;s device</text><text class="s ext-s" x="1092" y="336">RARA Bridge (PWA) · Web Serial / WebUSB</text><text class="s ext-s" x="1092" y="353">raw CLI on one panel, Claude&#x27;s reasoning on the other</text><text class="s ext-s" x="1092" y="370">the technician runs every command — Claude only suggests</text><rect class="ai" x="1080" y="460" width="480" height="92" rx="8"/><text class="t ai-t" x="1092" y="486">Claude</text><text class="s ai-s" x="1092" y="506">EARS drafting · HAZOP spec audit (generator ↔ critic)</text><text class="s ai-s" x="1092" y="523">diagnosis · commissioning · revamping</text><rect class="ai" x="1080" y="612" width="480" height="112" rx="8"/><text class="t ai-t" x="1092" y="638">Acervus — machine archive</text><text class="s ai-s" x="1092" y="658">one Libris per machine (repo-like, private per tenant)</text><text class="s ai-s" x="1092" y="675">as-built · calibrations · EARS history · board threads</text><text class="s ai-s" x="1092" y="692">fed by closed sessions, never by live telemetry</text><text class="s ai-s" x="1092" y="709">Ex Libris: printed QR survives a dead machine</text><path class="w" d="M 1000 180 L 1080 180" marker-end="url(#a-w)"/><text class="wl w-lab" x="1040" y="172" text-anchor="middle">Ethernet</text><path class="w" d="M 1000 345 L 1080 345" marker-end="url(#a-w)"/><text class="wl w-lab" x="1040" y="337" text-anchor="middle">USB-C · CLI</text><path class="net" d="M 1320 400 L 1320 460" marker-end="url(#a-net)" marker-start="url(#a-net)"/><text class="wl net-lab" x="1330" y="436" text-anchor="start">technician&#x27;s own data link</text><path class="net" d="M 1320 552 L 1320 612" marker-end="url(#a-net)" marker-start="url(#a-net)"/><text class="wl net-lab" x="1330" y="588" text-anchor="start">sessions archived on close</text><path class="w" d="M 40 772 L 90 772"/><text class="s leg" x="100" y="777">electrical / local link</text><path class="net" d="M 290 772 L 340 772"/><text class="s leg" x="350" y="777">internet link held by the technician's device, never by the PLC</text><text class="s leg" x="40" y="806">Seed-stage reference. Counts and parts follow the KiCad schematics; RARA.MB is stage 2. Hardware CERN-OHL-S v2.</text></svg>